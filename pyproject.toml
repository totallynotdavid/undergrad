[project]
name = "undergrad"
version = "0.1.0"
readme = "readme.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "RUF"]
# Allow these Unicode characters in lesson text.
allowed-confusables = ["×", "σ", "–", "−"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell shows its last expression, which B018 reads as useless.
"packages/**" = ["B018"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "notebooks" },
]
lint = [
    "ruff>=0.17.0",
]
notebooks = [
    "marimo>=0.25.1",
]
