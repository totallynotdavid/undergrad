[project]
name = "geophysics"
version = "0.1.0"
dependencies = [
    "certifi>=2026.10.23",
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "obspy>=1.5.1",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingemmet_peligros", "tsunamis"]
