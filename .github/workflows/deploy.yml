name: pages

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/**"
      - "**/*.py"
      - "**/pyproject.toml"
      - "notebooks.toml"
      - "scripts/export_notebooks.py"
      - "scripts/notebooks_manifest.py"
      - "site/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@b68407c192114b6e47cc45b98289832c3df00d5e # v.9.0.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: jdx/mise-action@d62ef600908822fe6a098b9e8116b46930205c52 # v4.2.4

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Validate site manifest
        run: uv run python scripts/export_notebooks.py validate

      - name: Export notebooks
        run: uv run python scripts/export_notebooks.py export --clean

      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
