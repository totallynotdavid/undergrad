name: marimo

on:
  workflow_dispatch:
  push:
    paths:
      - "física-general/péndulo-doble/main.py"
      - "física-general/pyproject.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: uv sync --package fisica-general

      - name: Check notebook
        run: uv run --package fisica-general marimo check física-general/péndulo-doble/main.py

      - name: Export interactive app
        run: |
          uv run --package fisica-general marimo export html-wasm \
            física-general/péndulo-doble/main.py \
            -o _site \
            --mode run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
