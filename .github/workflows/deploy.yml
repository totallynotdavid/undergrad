name: pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "**/*.py"
      - "**/pyproject.toml"
      - "notebooks.toml"
      - "scripts/export_notebooks.py"
      - "scripts/notebooks_manifest.py"
      - "scripts/check_notebooks.py"
      - "scripts/test_export_notebooks.py"
      - "site/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: mise run install

      - name: Check and build the site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: mise run check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: github-pages
