name: pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &site-inputs
      - "packages/**"
      - "**/*.py"
      - "**/pyproject.toml"
      - "notebooks.toml"
      - "scripts/export_notebooks.py"
      - "scripts/notebooks_manifest.py"
      - "site/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths: *site-inputs

# A pending run replaces the pending run of its group, so pull requests get
# their own group and cannot displace a queued deploy of master.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Validate site manifest
        run: uv run python scripts/export_notebooks.py validate

      - name: Export notebooks
        run: uv run python scripts/export_notebooks.py export --clean

      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
