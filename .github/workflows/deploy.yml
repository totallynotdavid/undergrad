name: pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &site-inputs
      - "packages/**"
      - "**/*.py"
      - "**/pyproject.toml"
      - "notebooks.toml"
      - "scripts/export_notebooks.py"
      - "scripts/notebooks_manifest.py"
      - "scripts/check_notebooks.py"
      - "scripts/test_export_notebooks.py"
      - "site/**"
      - "mise.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths: *site-inputs

# A pending run replaces the pending run of its group, so pull requests get
# their own group and cannot displace a queued deploy of master.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install site dependencies
        run: bun install --cwd site --frozen-lockfile

      - name: Validate site manifest
        run: uv run python scripts/export_notebooks.py validate

      - name: Check every notebook
        run: mise run check-notebooks

      - name: Test the export script
        run: mise run test-scripts

      - name: Export notebooks
        run: uv run python scripts/export_notebooks.py export --clean

      - name: Build site
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
