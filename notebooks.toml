[site]
title = "Cuadernos"
description = "Cuadernos de fisica computacional: metodos numericos, sistemas dinamicos, mecanica estadistica y teledeteccion."
repository = "https://github.com/totallynotdavid/undergrad"
branch = "master"

[defaults]
root = "packages"

[[courses]]
id = "fisica-general"
title = "Fisica general"
package = "fisica-general"

[[courses.sections]]
id = "pendulos"
title = "Pendulos"

[[courses.sections.notebooks]]
id = "pendulo-doble"
title = "Pendulo doble acoplado"
file = "pendulo_doble.py"
summary = "Dos angulos acoplados integrados con Euler explicito, con la acumulacion de error que el metodo introduce."
export = true

[[courses]]
id = "fisica-computacional"
title = "Fisica computacional"
package = "fisica-computacional"

[[courses.sections]]
id = "metodos-numericos"
title = "Metodos numericos"

[[courses.sections.notebooks]]
id = "pendulo-simple"
title = "Pendulo simple"
file = "metodos-numericos/pendulos-y-osciladores/pendulo_simple.py"
summary = "Oscilador no lineal integrado numericamente y su limite de pequenas oscilaciones."
export = true

[[courses.sections.notebooks]]
id = "pendulo-doble"
title = "Pendulo doble"
file = "metodos-numericos/pendulos-y-osciladores/pendulo_doble.py"
summary = "Sistema caotico de dos grados de libertad y su dependencia sensible de las condiciones iniciales."
export = true

[[courses.sections.notebooks]]
id = "edp-calor"
title = "EDP de calor en una dimension"
file = "metodos-numericos/edp/edp_calor.py"
summary = "Diferencias finitas explicitas para la ecuacion de calor 1D y su condicion de estabilidad."
export = true

[[courses.sections.notebooks]]
id = "monte-carlo"
title = "Integracion de Monte Carlo"
file = "metodos-numericos/monte-carlo/main.py"
summary = "Estimador de Monte Carlo, su error estadistico que decae como 1/sqrt(N), y contraste con una rutina local en Fortran."
export = true

[[courses.sections.notebooks]]
id = "monte-carlo-fortran"
title = "Monte Carlo con Fortran y f2py"
file = "metodos-numericos/monte-carlo/fortran_f2py.py"
summary = "El mismo estimador de Monte Carlo enlazado a una rutina Fortran con f2py, como extension nativa local."
export = false

[[courses]]
id = "fisica-moderna"
title = "Fisica moderna"
package = "fisica-moderna"

[[courses.sections]]
id = "sistemas-dinamicos"
title = "Sistemas dinamicos"

[[courses.sections.notebooks]]
id = "atractor-de-lorenz"
title = "Atractor de Lorenz"
file = "atractor_de_lorenz.py"
summary = "Sistema de Lorenz integrado en su regimen caotico y la geometria del atractor."
export = true

[[courses.sections]]
id = "radiacion"
title = "Radiacion"

[[courses.sections.notebooks]]
id = "curva-de-planck"
title = "Curva de Planck"
file = "curva-de-planck/main.py"
summary = "Ley de Planck y los limites de Rayleigh-Jeans y Wien, con el calculo en Fortran local."
export = false

[[courses]]
id = "mecanica-estadistica"
title = "Mecanica estadistica"
package = "mecanica-estadistica"

[[courses.sections]]
id = "monte-carlo"
title = "Monte Carlo"

[[courses.sections.notebooks]]
id = "volumen-hiperesfera"
title = "Volumen de la hiperesfera"
file = "calcular_volumen_esfera_n_dimensiones.py"
summary = "Estimacion Monte Carlo del volumen de la bola unitaria en n dimensiones y su decaimiento con la dimension."
export = false

[[courses.sections.notebooks]]
id = "modelo-de-ising"
title = "Modelo de Ising 3D"
file = "modelo_de_ising.py"
summary = "Algoritmo de Metropolis para el modelo de Ising 3D, con la magnetizacion y la transicion de fase."
export = false

[[courses]]
id = "inteligencia-artificial"
title = "Inteligencia artificial"
package = "inteligencia-artificial"

[[courses.sections]]
id = "datos-tabulares"
title = "Datos tabulares"

[[courses.sections.notebooks]]
id = "limpieza-datos-tabulares"
title = "Limpieza de datos tabulares"
file = "limpieza_datos_tabulares.py"
summary = "Limpieza y codificacion de variables sobre datos tabulares, con el dataset Titanic."
export = false

[[courses]]
id = "tecnicas-de-teledeteccion"
title = "Tecnicas de teledeteccion"
package = "tecnicas-de-teledeteccion"

[[courses.sections]]
id = "earth-engine-y-6s"
title = "Earth Engine y 6S"

[[courses.sections.notebooks]]
id = "clase-0-py6s"
title = "Clase 0: Py6S"
file = "earth-engine-y-6s/clase_0_py6s.py"
summary = "Transferencia radiativa atmosferica con el modelo 6S a traves de Py6S."
export = false

[[courses.sections.notebooks]]
id = "clase-1-earth-engine"
title = "Clase 1: Earth Engine"
file = "earth-engine-y-6s/clase_1_earth_engine.py"
summary = "Acceso y procesamiento de imagenes satelitales con Google Earth Engine."
export = false

[[courses.sections]]
id = "raster-y-gdal"
title = "Raster y GDAL"

[[courses.sections.notebooks]]
id = "clase-2-gdal"
title = "Clase 2: GDAL"
file = "raster-y-gdal/clase_2_gdal.py"
summary = "Lectura y manipulacion de rasteres Landsat con GDAL."
export = false

[[courses.sections]]
id = "correccion-atmosferica"
title = "Correccion atmosferica"

[[courses.sections.notebooks]]
id = "correccion-atmosferica-gaofen1"
title = "Correccion atmosferica GaoFen-1"
file = "correccion-atmosferica-gaofen1/main.py"
summary = "Correccion atmosferica de imagenes GaoFen-1 con 6S y rasterio."
export = false

[[courses]]
id = "fundamentos-de-riesgos-y-desastres"
title = "Fundamentos de riesgos y desastres"
package = "fundamentos-de-riesgos-y-desastres"

[[courses.sections]]
id = "sigrid"
title = "SIGRID"

[[courses.sections.notebooks]]
id = "huaicos-ancash"
title = "Analisis de huaicos en Ancash"
file = "sigrid/analisis_huaicos_ancash.py"
summary = "Analisis geoespacial de huaicos en Ancash con geopandas sobre datos del SIGRID."
