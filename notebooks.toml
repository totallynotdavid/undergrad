[site]
title = "Apuntes de pregrado"
description = "Cuadernos interactivos y materiales para ejecucion local."
repository = "https://github.com/totallynotdavid/undergrad"
branch = "master"

[defaults]
root = "packages"

[[courses]]
id = "fisica-general"
title = "Fisica general"
package = "fisica-general"

[[courses.sections]]
id = "pendulos"
title = "Pendulos"

[[courses.sections.notebooks]]
id = "pendulo-doble"
title = "Pendulo doble acoplado"
file = "pendulo_doble.py"
summary = "Modelo didactico de dos angulos acoplados con integracion explicita de Euler."
export = true

[[courses]]
id = "fisica-computacional"
title = "Fisica computacional"
package = "fisica-computacional"

[[courses.sections]]
id = "metodos-numericos"
title = "Metodos numericos"

[[courses.sections.notebooks]]
id = "pendulo-simple"
title = "Pendulo simple"
file = "metodos-numericos/pendulos-y-osciladores/pendulo_simple.py"
summary = "Integracion numerica y visualizacion de un pendulo simple."
export = true

[[courses.sections.notebooks]]
id = "pendulo-doble"
title = "Pendulo doble"
file = "metodos-numericos/pendulos-y-osciladores/pendulo_doble.py"
summary = "Integracion numerica y visualizacion de un pendulo doble."
export = true

[[courses.sections.notebooks]]
id = "edp-calor"
title = "EDP de calor en una dimension"
file = "metodos-numericos/edp/edp_calor.py"
summary = "Metodo explicito de diferencias finitas y condicion de estabilidad."
export = true

[[courses.sections.notebooks]]
id = "monte-carlo"
title = "Integracion de Monte Carlo"
file = "metodos-numericos/monte-carlo/main.py"
summary = "Estimadores de Monte Carlo, error estadistico y comparacion con resultados locales en Fortran."
export = true

[[courses.sections.notebooks]]
id = "monte-carlo-fortran"
title = "Monte Carlo con Fortran y f2py"
file = "metodos-numericos/monte-carlo/fortran_f2py.py"
summary = "Compilacion local de rutinas Fortran y extensiones nativas."
export = false

[[courses]]
id = "fisica-moderna"
title = "Fisica moderna"
package = "fisica-moderna"

[[courses.sections]]
id = "sistemas-dinamicos"
title = "Sistemas dinamicos"

[[courses.sections.notebooks]]
id = "atractor-de-lorenz"
title = "Atractor de Lorenz"
file = "atractor_de_lorenz.py"
summary = "Integracion del sistema de Lorenz y visualizacion tridimensional."
export = true

[[courses.sections]]
id = "radiacion"
title = "Radiacion"

[[courses.sections.notebooks]]
id = "curva-de-planck"
title = "Curva de Planck"
file = "curva-de-planck/main.py"
summary = "Requiere gfortran-13 para compilar y ejecutar el codigo Fortran."
export = false

[[courses]]
id = "mecanica-estadistica"
title = "Mecanica estadistica"
package = "mecanica-estadistica"

[[courses.sections]]
id = "monte-carlo"
title = "Monte Carlo"

[[courses.sections.notebooks]]
id = "volumen-hiperesfera"
