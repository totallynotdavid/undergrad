[project]
name = "fundamentos-de-riesgos-y-desastres"
version = "0.1.0"
description = "Notebooks y utilidades para análisis de riesgos y desastres"
readme = "README.md"
requires-python = ">=3.10, <3.14"
dependencies = [
    "geopandas>=1.0.0",
    "marimo>=0.17.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.1",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigrid_data_extractor"]
