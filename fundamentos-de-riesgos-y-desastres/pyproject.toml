[project]
name = "fundamentos-de-riesgos-y-desastres"
version = "0.1.0"
readme = "readme.txt"
dependencies = [
    "geopandas>=1.0.0",
    "marimo>=0.23.8",
    "matplotlib>=3.10.7",
    "openpyxl>=3.1.2",
    "pandas>=2.3.3",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigrid_data_extractor"]
